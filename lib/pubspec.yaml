4. Backend & Firebase Security Rules (Play Store Policy Compliant)

codeJavaScript

rules_version = '2'; service cloud.firestore { match /databases/{database}/documents { // Helper: Check if user is authenticated and verified function isAuthenticated() { return request.auth != null; } function isVerifiedUser() { return isAuthenticated() && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.verificationStatus == 'VERIFIED'; } // 1. Users Collection match /users/{userId} { allow read: if isAuthenticated(); allow create, update: if isAuthenticated() && request.auth.uid == userId; } // 2. Sensitive CNIC Documents (Restricted to Owner only) match /cnic_documents/{userId} { allow read, write: if isAuthenticated() && request.auth.uid == userId; } // 3. Listings Collection (Read public, Create ONLY if CNIC verified) match /listings/{listingId} { allow read: if true; allow create: if isVerifiedUser() && request.resource.data.ownerId == request.auth.uid; allow update, delete: if isVerifiedUser() && resource.data.ownerId == request.auth.uid; } // 4. In-App Chats (Restricted to thread participants) match /chats/{chatId} { allow read: if isAuthenticated() && ( resource.data.renterId == request.auth.uid || resource.data.ownerId == request.auth.uid ); allow create: if isVerifiedUser(); match /messages/{messageId} { allow read, write: if isAuthenticated() && ( get(/databases/$(database)/documents/chats/$(chatId)).data.renterId == request.auth.uid || get(/databases/$(database)/documents/chats/$(chatId)).data.ownerId == request.auth.uid ); } } } }

